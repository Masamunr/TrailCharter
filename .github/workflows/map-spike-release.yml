name: Publish map spike APK

on:
  push:
    branches:
      - spike/map-routing-boundaries
    paths:
      - '.github/workflows/map-spike-release.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    name: Publish verified run 75 APK
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download verified run 75 artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: '9702684673'
        run: |
          set -euo pipefail
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > run75.zip
          unzip -q run75.zip -d run75
          APK_PATH=$(find run75 -type f -name '*.apk' -print -quit)
          test -n "$APK_PATH"
          cp "$APK_PATH" TrailCharter-map-spike-run-75.apk

      - name: Verify exact APK before publishing
        run: |
          set -euo pipefail
          EXPECTED_SHA256='f21ef74e74b3b0edb2f68bf2b42c8e4b436ae07f72fe0ef80702f213f2bfbfb4'
          ACTUAL_SHA256=$(sha256sum TrailCharter-map-spike-run-75.apk | awk '{print $1}')
          test "$ACTUAL_SHA256" = "$EXPECTED_SHA256"
          echo "Verified APK SHA-256: $ACTUAL_SHA256"
          ls -lh TrailCharter-map-spike-run-75.apk

      - name: Publish public prerelease asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: map-spike-run-75
          TARGET_SHA: ed10e72eb2b18d3f6d7bc37226084c74a9ee0c1d
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$TARGET_SHA" \
              --title 'TrailCharter Map Spike Run 75' \
              --notes 'EXPLORE/SPIKE build only. CI-verified z15 Eryri vector/terrain package with compact 0°, 30° and 50° map view presets. Not production TrailCharter and not physical-device accepted yet.' \
              --prerelease
          fi
          gh release upload "$TAG" TrailCharter-map-spike-run-75.apk \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY"
