name: Publish map spike APK

on:
  push:
    branches:
      - spike/map-routing-boundaries
    paths:
      - '.github/workflows/map-spike-release.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    name: Publish verified run 79 APK
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download verified run 79 artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: '9703375767'
        run: |
          set -euo pipefail
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > run79.zip
          unzip -q run79.zip -d run79
          APK_PATH=$(find run79 -type f -name '*.apk' -print -quit)
          test -n "$APK_PATH"
          cp "$APK_PATH" TrailCharter-map-spike-run-79.apk

      - name: Verify exact APK before publishing
        run: |
          set -euo pipefail
          EXPECTED_SHA256='048aebb8dc40f59eb136d1192e3423f56bb9d0fcdbce4ecfb88569fabbe362af'
          EXPECTED_SIZE='164819900'
          ACTUAL_SHA256=$(sha256sum TrailCharter-map-spike-run-79.apk | awk '{print $1}')
          ACTUAL_SIZE=$(stat -c%s TrailCharter-map-spike-run-79.apk)
          test "$ACTUAL_SHA256" = "$EXPECTED_SHA256"
          test "$ACTUAL_SIZE" = "$EXPECTED_SIZE"
          echo "Verified APK SHA-256: $ACTUAL_SHA256"
          echo "Verified APK size: $ACTUAL_SIZE bytes"

      - name: Publish public prerelease asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: map-spike-run-79
          TARGET_SHA: f21021b92949559791a1ec90f338969dcf63cc93
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$TARGET_SHA" \
              --title 'TrailCharter Map Spike Run 79' \
              --notes 'EXPLORE/SPIKE build only. Corrective installability build: full Eryri z0-z12 terrain plus a controlled central Yr Wyddfa z13-z15 terrain test area, z15 vector basemap, compact 0°, 30° and 50° view presets, isolated .mapspike package at versionCode 12, and CI-verified network/location-silent permissions. Run 75 is superseded for device testing. Not production TrailCharter and not physically accepted yet.' \
              --prerelease
          fi
          gh release upload "$TAG" TrailCharter-map-spike-run-79.apk \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY"
