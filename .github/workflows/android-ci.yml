name: Android CI

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'tools/maps/**'
      - 'tools/routing/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/android-ci.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'tools/maps/**'
      - 'tools/routing/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/android-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, lint and assemble debug
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK 36
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build standalone Eryri East offline map package
        if: github.event_name == 'pull_request' && github.head_ref == 'spike/map-routing-boundaries'
        run: |
          set -euo pipefail

          PMTILES_VERSION=1.31.2
          PMTILES_ARCHIVE="go-pmtiles_${PMTILES_VERSION}_Linux_x86_64.tar.gz"
          PMTILES_URL="https://github.com/protomaps/go-pmtiles/releases/download/v${PMTILES_VERSION}/${PMTILES_ARCHIVE}"
          PMTILES_SHA256="3ed7dbf4ec2e6dfe5e25b6f70d1ffc932729f93c86db353bf514dd71010a312f"
          TOOL_DIR="$RUNNER_TEMP/pmtiles-cli"
          PACKAGE_PATH="$RUNNER_TEMP/trailcharter-eryri-east-pass4-spike.zip"

          mkdir -p "$TOOL_DIR"
          curl --fail --location --retry 3 --silent --show-error \
            "$PMTILES_URL" -o "$TOOL_DIR/$PMTILES_ARCHIVE"
          echo "$PMTILES_SHA256  $TOOL_DIR/$PMTILES_ARCHIVE" | sha256sum --check --strict
          tar -xzf "$TOOL_DIR/$PMTILES_ARCHIVE" -C "$TOOL_DIR"
          PMTILES_BIN=$(find "$TOOL_DIR" -maxdepth 2 -type f -name pmtiles -print -quit)
          test -n "$PMTILES_BIN"
          chmod +x "$PMTILES_BIN"

          python3 -m py_compile tools/maps/build_eryri_pass3_package.py
          python3 tools/maps/build_eryri_pass3_package.py \
            --pmtiles "$PMTILES_BIN" \
            --output "$PACKAGE_PATH"
          test -s "$PACKAGE_PATH"
          echo "TRAILCHARTER_MAP_PACKAGE_PATH=$PACKAGE_PATH" >> "$GITHUB_ENV"

      - name: Verify standalone Eryri East offline map package
        if: github.event_name == 'pull_request' && github.head_ref == 'spike/map-routing-boundaries'
        run: |
          set -euo pipefail
          test -s "$TRAILCHARTER_MAP_PACKAGE_PATH"
          MAP_PACKAGE_PATH="$TRAILCHARTER_MAP_PACKAGE_PATH" python3 - <<'PY'
          import hashlib
          import json
          import os
          import zipfile

          package = os.environ["MAP_PACKAGE_PATH"]
          expected_paths = {
              "manifest.json",
              "eryri-basemap.pmtiles",
              "eryri-terrain.pmtiles",
              "eryri-contours.pmtiles",
              "eryri-hiking-routes.geojson",
              "glyphs/TrailCharterSans/0-255.pbf",
          }

          with zipfile.ZipFile(package) as archive:
              actual_paths = {info.filename for info in archive.infolist() if not info.is_dir()}
              if actual_paths != expected_paths:
                  raise SystemExit(f"Unexpected package members: {sorted(actual_paths ^ expected_paths)}")

              manifest = json.loads(archive.read("manifest.json"))
              if manifest.get("schemaVersion") != 2:
                  raise SystemExit("Unexpected map-package schema")
              if manifest.get("packageId") != "uk-wales-eryri-east-pass4-spike":
                  raise SystemExit("Unexpected map-package ID")
              if manifest.get("runtimeNetworkRequired") is not False:
                  raise SystemExit("Map package unexpectedly requires runtime networking")

              bounds = manifest.get("bounds", [])
              if len(bounds) != 4 or bounds[2] < -3.88:
                  raise SystemExit(f"Map package does not include agreed eastward expansion: {bounds}")

              layers = manifest.get("layers", {})
              hiking_layer = layers.get("hikingRoutes", {})
              if hiking_layer.get("path") != "eryri-hiking-routes.geojson":
                  raise SystemExit("Hiking-route relation payload is missing from manifest")
              if hiking_layer.get("kind") != "geojson":
                  raise SystemExit("Hiking-route relation payload has unexpected kind")

              for layer_name, layer in layers.items():
                  path = layer["path"]
                  payload = archive.read(path)
                  actual_hash = hashlib.sha256(payload).hexdigest()
                  if len(payload) != layer["bytes"]:
                      raise SystemExit(f"Size mismatch for {path}")
                  if actual_hash != layer["sha256"]:
                      raise SystemExit(f"SHA-256 mismatch for {path}")
                  print(f"{layer_name}: {path}, {len(payload)} bytes, {actual_hash}")

              routes = json.loads(archive.read("eryri-hiking-routes.geojson"))
              if routes.get("type") != "FeatureCollection":
                  raise SystemExit("Hiking-route relation payload is not a GeoJSON FeatureCollection")
              features = routes.get("features", [])
              if not features:
                  raise SystemExit("Hiking-route relation payload contains no features")
              route_names = [str(feature.get("properties", {}).get("name", "")) for feature in features]
              if not any("watkin" in name.casefold() for name in route_names):
                  raise SystemExit(f"Watkin Path acceptance relation missing; names include: {route_names[:20]}")
              declared_count = hiking_layer.get("featureCount")
              if declared_count != len(features):
                  raise SystemExit(
                      f"Hiking-route feature count mismatch: manifest={declared_count}, actual={len(features)}"
                  )
              print(f"Hiking-route relation features: {len(features)}; Watkin acceptance case present")

          package_bytes = os.path.getsize(package)
          if package_bytes > 260 * 1024 * 1024:
              raise SystemExit(f"Map package exceeded 260 MiB spike ceiling: {package_bytes}")
          print(f"Standalone Eryri East map package: {package_bytes} bytes")
          PY

      - name: Build standalone Eryri BRouter WALK package
        if: github.event_name == 'pull_request' && github.head_ref == 'spike/map-routing-boundaries'
        run: |
          set -euo pipefail
          ROUTING_PACKAGE_PATH="$RUNNER_TEMP/trailcharter-eryri-brouter-walk-spike.zip"
          python3 -m py_compile tools/routing/build_eryri_brouter_package.py
          python3 tools/routing/build_eryri_brouter_package.py --output "$ROUTING_PACKAGE_PATH"
          test -s "$ROUTING_PACKAGE_PATH"
          echo "TRAILCHARTER_ROUTING_PACKAGE_PATH=$ROUTING_PACKAGE_PATH" >> "$GITHUB_ENV"

      - name: Verify standalone BRouter routing package
        if: github.event_name == 'pull_request' && github.head_ref == 'spike/map-routing-boundaries'
        run: |
          set -euo pipefail
          test -s "$TRAILCHARTER_ROUTING_PACKAGE_PATH"
          ROUTING_PACKAGE_PATH="$TRAILCHARTER_ROUTING_PACKAGE_PATH" python3 - <<'PY'
          import hashlib
          import json
          import os
          import zipfile

          package = os.environ["ROUTING_PACKAGE_PATH"]
          expected_paths = {
              "manifest.json",
              "segments4/W5_N50.rd5",
              "profiles2/hiking-mountain.brf",
              "profiles2/lookups.dat",
          }
          with zipfile.ZipFile(package) as archive:
              actual_paths = {info.filename for info in archive.infolist() if not info.is_dir()}
              if actual_paths != expected_paths:
                  raise SystemExit(f"Unexpected routing package members: {sorted(actual_paths ^ expected_paths)}")

              manifest = json.loads(archive.read("manifest.json"))
              if manifest.get("schemaVersion") != 1:
                  raise SystemExit("Unexpected routing-package schema")
              if manifest.get("packageId") != "uk-wales-eryri-brouter-walk-spike":
                  raise SystemExit("Unexpected routing-package ID")
              if manifest.get("travelMode") != "WALK":
                  raise SystemExit("Routing package is not WALK")
              if manifest.get("runtimeNetworkRequired") is not False:
                  raise SystemExit("Routing package unexpectedly requires runtime networking")
              engine = manifest.get("routingEngine", {})
              if engine.get("name") != "BRouter" or engine.get("version") != "1.7.10":
                  raise SystemExit(f"Unexpected routing engine metadata: {engine}")
              overrides = manifest.get("profileOverrides", {})
              if overrides.get("correctMisplacedViaPoints") is not True:
                  raise SystemExit("Misplaced-via correction is not enabled in routing package")
              if overrides.get("correctMisplacedViaPointsDistance") != 400:
                  raise SystemExit(f"Unexpected misplaced-via correction distance: {overrides}")

              for payload_name, payload in manifest["payloads"].items():
                  path = payload["path"]
                  data = archive.read(path)
                  actual_hash = hashlib.sha256(data).hexdigest()
                  if len(data) != payload["bytes"]:
                      raise SystemExit(f"Size mismatch for routing payload {path}")
                  if actual_hash != payload["sha256"]:
                      raise SystemExit(f"SHA-256 mismatch for routing payload {path}")
                  print(f"{payload_name}: {path}, {len(data)} bytes, {actual_hash}")

          package_bytes = os.path.getsize(package)
          if package_bytes > 190 * 1024 * 1024:
              raise SystemExit(f"Routing package exceeded 190 MiB spike ceiling: {package_bytes}")
          print(f"Standalone BRouter routing package: {package_bytes} bytes")
          PY

      - name: Prepare continuity debug signing
        env:
          KEYSTORE_B64: ${{ secrets.TRAILCHARTER_CI_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.TRAILCHARTER_CI_KEYSTORE_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_B64" || -z "$KEYSTORE_PASSWORD" ]]; then
            if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
              echo "Continuity signing secrets are required for authoritative main APKs." >&2
              exit 1
            fi
            echo "Continuity signing secrets unavailable for this PR; using the standard disposable debug signer."
            echo "TRAILCHARTER_CONTINUITY_SIGNING=false" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "::add-mask::$KEYSTORE_PASSWORD"
          KEYSTORE_PATH="$RUNNER_TEMP/trailcharter-ci-debug.p12"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -storetype PKCS12 \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias trailcharter-ci-debug >/dev/null

          echo "TRAILCHARTER_CI_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "TRAILCHARTER_CI_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "TRAILCHARTER_CI_KEY_ALIAS=trailcharter-ci-debug" >> "$GITHUB_ENV"
          echo "TRAILCHARTER_CI_KEY_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "TRAILCHARTER_CONTINUITY_SIGNING=true" >> "$GITHUB_ENV"

      - name: Unit tests, lint and debug build
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace --no-daemon

      - name: Verify map and routing data are not embedded in spike APK
        if: github.event_name == 'pull_request' && github.head_ref == 'spike/map-routing-boundaries'
        run: |
          set -euo pipefail
          APK_PATH=$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)
          test -n "$APK_PATH"
          APK_PATH="$APK_PATH" python3 - <<'PY'
          import os
          import zipfile

          apk = os.environ["APK_PATH"]
          with zipfile.ZipFile(apk) as archive:
              names = archive.namelist()
              embedded_maps = [name for name in names if name.startswith("assets/map_spike/")]
              embedded_routes = [name for name in names if name.endswith(".rd5") or "hiking-mountain.brf" in name]
              if embedded_maps:
                  raise SystemExit(f"Regional map data is still embedded in the APK: {embedded_maps[:5]}")
              if embedded_routes:
                  raise SystemExit(f"Routing data/profile is embedded in the APK: {embedded_routes[:5]}")

          apk_bytes = os.path.getsize(apk)
          if apk_bytes > 120 * 1024 * 1024:
              raise SystemExit(f"Package-split APK exceeded 120 MiB spike ceiling: {apk_bytes}")
          print(f"Routing-spike APK: {apk_bytes} bytes; no regional map/routing payload embedded")
          PY

      - name: Verify spike install identity and privacy baseline
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)
          test -n "$APK_PATH"

          BADGING=$("$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK_PATH")
          printf '%s\n' "$BADGING" | head -n 3
          grep -q "package: name='com.masamunr.trailcharter.mapspike' versionCode='21'" <<< "$BADGING"

          PERMISSIONS=$("$ANDROID_HOME/build-tools/36.0.0/aapt2" dump permissions "$APK_PATH")
          printf '%s\n' "$PERMISSIONS"

          FORBIDDEN_PERMISSIONS=(
            android.permission.INTERNET
            android.permission.ACCESS_NETWORK_STATE
            android.permission.ACCESS_WIFI_STATE
            android.permission.ACCESS_COARSE_LOCATION
            android.permission.ACCESS_FINE_LOCATION
            android.permission.READ_EXTERNAL_STORAGE
            android.permission.WRITE_EXTERNAL_STORAGE
            android.permission.MANAGE_EXTERNAL_STORAGE
          )

          for permission in "${FORBIDDEN_PERMISSIONS[@]}"; do
            if grep -q "$permission" <<< "$PERMISSIONS"; then
              echo "Unexpected permission in final merged APK: $permission" >&2
              exit 1
            fi
          done
          echo "Map/routing spike identity/version and network/location/storage-silent permission baseline verified."

      - name: Verify continuity signing certificate
        env:
          EXPECTED_CERT_SHA256: b0c753f9b46c1ca25a0ae546e4aefe818a95dc83f95be74bccd3cf17e947d26c
        run: |
          if [[ "$TRAILCHARTER_CONTINUITY_SIGNING" != "true" ]]; then
            echo "Continuity signing verification skipped for an untrusted/external PR build."
            exit 0
          fi

          APK_PATH=$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)
          test -n "$APK_PATH"
          ACTUAL_CERT_SHA256=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK_PATH" | awk -F ': ' '/certificate SHA-256 digest/ {print tolower($2); exit}')
          if [[ "$ACTUAL_CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]]; then
            echo "Unexpected debug signing certificate: $ACTUAL_CERT_SHA256" >&2
            exit 1
          fi
          echo "Continuity debug signing certificate verified."

      - name: Upload Room schemas
        uses: actions/upload-artifact@v6
        with:
          name: trailcharter-room-schema-run-${{ github.run_number }}
          path: app/schemas/**
          if-no-files-found: error
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: trailcharter-debug-run-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload standalone Eryri East map package
        if: github.event_name == 'pull_request' && github.head_ref == 'spike/map-routing-boundaries'
        uses: actions/upload-artifact@v6
        with:
          name: trailcharter-eryri-east-package-run-${{ github.run_number }}
          path: ${{ runner.temp }}/trailcharter-eryri-east-pass4-spike.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload standalone Eryri BRouter routing package
        if: github.event_name == 'pull_request' && github.head_ref == 'spike/map-routing-boundaries'
        uses: actions/upload-artifact@v6
        with:
          name: trailcharter-eryri-brouter-routing-run-${{ github.run_number }}
          path: ${{ runner.temp }}/trailcharter-eryri-brouter-walk-spike.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: trailcharter-reports-run-${{ github.run_number }}
          path: |
            app/build/reports/**
            app/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7
