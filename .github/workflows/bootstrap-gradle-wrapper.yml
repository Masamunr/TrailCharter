name: Bootstrap Gradle Wrapper

on:
  push:
    branches:
      - bootstrap/android-foundation
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    name: Generate wrapper and verify foundation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out bootstrap branch
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Provide Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Generate and verify Gradle Wrapper
        shell: bash
        run: |
          rm -rf .bootstrap-wrapper
          mkdir -p .bootstrap-wrapper
          printf "rootProject.name = 'wrapper-bootstrap'\n" > .bootstrap-wrapper/settings.gradle
          gradle -p .bootstrap-wrapper wrapper \
            --gradle-version 8.13 \
            --distribution-type bin \
            --gradle-distribution-sha256-sum 20f1b1176237254a6fc204d8434196fa11a4cfb387567519c61556e8710aed78

          mkdir -p gradle/wrapper
          cp .bootstrap-wrapper/gradlew ./gradlew
          cp .bootstrap-wrapper/gradlew.bat ./gradlew.bat
          cp .bootstrap-wrapper/gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.jar
          cp .bootstrap-wrapper/gradle/wrapper/gradle-wrapper.properties gradle/wrapper/gradle-wrapper.properties
          chmod +x ./gradlew

          echo "81a82aaea5abcc8ff68b3dfcb58b3c3c429378efd98e7433460610fecd7ae45f  gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -
          grep -F "distributionSha256Sum=20f1b1176237254a6fc204d8434196fa11a4cfb387567519c61556e8710aed78" gradle/wrapper/gradle-wrapper.properties

      - name: Set up Android SDK 36
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Verify Android foundation
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace --no-daemon

      - name: Commit generated wrapper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          if git diff --cached --quiet; then
            echo "Gradle Wrapper already committed."
            exit 0
          fi
          git commit -m "Bootstrap Gradle 8.13 wrapper"
          git push origin HEAD
